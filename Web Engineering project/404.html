<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>404 - Page Not Found</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="js/darkmode.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #d4a574 0%, #fdb750 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .error-container {
        text-align: center;
        background: white;
        border-radius: 20px;
        padding: 60px 40px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        animation: slideIn 0.6s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .error-code {
        font-size: 120px;
        font-weight: 700;
        color: #d35400;
        line-height: 1;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .error-title {
        font-size: 32px;
        font-weight: 700;
        color: #3e2300;
        margin-bottom: 15px;
      }

      .error-message {
        font-size: 16px;
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .error-icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .home-btn {
        display: inline-block;
        padding: 14px 40px;
        background: linear-gradient(135deg, #d35400, #e67a00);
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(211, 84, 0, 0.3);
      }

      .home-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(211, 84, 0, 0.4);
        background: linear-gradient(135deg, #c2480f, #d66a00);
      }

      .home-btn:active {
        transform: translateY(-1px);
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #8c5500;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
      }

      .back-link:hover {
        color: #d35400;
        text-decoration: underline;
      }

      .honeycomb {
        display: grid;
        grid-template-columns: repeat(3, 60px);
        gap: 10px;
        justify-content: center;
        margin: 20px 0;
        opacity: 0.3;
      }

      .honeycomb-cell {
        width: 60px;
        height: 60px;
        background: #ffd700;
        border: 2px solid #d35400;
        border-radius: 5px;
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body class="page-404-body">
    <div class="error-container">
      <div class="error-icon">🍯</div>

      <div class="error-code">404</div>

      <h1 class="error-title">Page Not Found</h1>

      <p class="error-message">
        Oops! It looks like the page you're looking for doesn't exist or has
        been moved. Let's get you back on track!
      </p>

      <div class="honeycomb">
        <div class="honeycomb-cell"></div>
        <div class="honeycomb-cell"></div>
        <div class="honeycomb-cell"></div>
        <div class="honeycomb-cell"></div>
        <div class="honeycomb-cell"></div>
        <div class="honeycomb-cell"></div>
      </div>

      <a href="./home/home.html" class="home-btn">🏠 Go to Home Page</a>

      <div>
        <a href="javascript:history.back()" class="back-link">← Go Back</a>
      </div>
    </div>

    <button class="dm-toggle-btn" id="dmBtn404" style="position:fixed;top:16px;right:16px;z-index:9999;">🌙</button>
    <script src="js/darkmode.js"></script>
  </body>
</html>
